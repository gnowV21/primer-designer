name: Tests

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  test-algorithm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache apt packages (ncbi-blast+)
        uses: actions/cache@v4
        id: apt-blast-cache
        with:
          path: /var/cache/apt/archives
          key: apt-blast-${{ runner.os }}-${{ hashFiles('.github/workflows/test_phase3.yml') }}

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ncbi-blast+ (apt)
        run: sudo apt-get install -y --no-install-recommends ncbi-blast+

      - name: Cache BLAST DB
        uses: actions/cache@v4
        id: blast-db-cache
        with:
          path: backend/data/blast_db
          key: blast-db-${{ runner.os }}-${{ hashFiles('backend/data/blast_db/metadata.json') }}

      - name: Bootstrap BLAST DB (if cache miss)
        if: steps.blast-db-cache.outputs.cache-hit != 'true'
        run: |
          cd backend
          python -m scripts.bootstrap_blast_db

      - name: Validate family grouping DB
        run: python benchmark/validate_family_grouping.py

      - name: Unit tests — algorithm (bound_fraction, scoring, blast_offtarget)
        run: |
          cd backend
          python -m pytest tests/test_bound_fraction.py tests/test_family_crossreactivity.py tests/test_isomir_flag.py tests/test_constants_v22.py tests/test_heterodimer.py -v

      - name: Unit tests — utils (SQLiteKVCache)
        run: |
          cd backend
          python -m pytest tests/test_sqlite_kv_cache.py -v

      - name: Build script logic test with mock data (no real DB build)
        run: |
          cd backend
          python -m pytest tests/scripts/test_build_family_db.py -v -m "not slow"

  smoke-test:
    runs-on: ubuntu-latest
    needs: test-algorithm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ncbi-blast+ (apt)
        run: sudo apt-get install -y --no-install-recommends ncbi-blast+

      - name: Cache BLAST DB
        uses: actions/cache@v4
        id: blast-db-cache
        with:
          path: backend/data/blast_db
          key: blast-db-${{ runner.os }}-${{ hashFiles('backend/data/blast_db/metadata.json') }}

      - name: Bootstrap BLAST DB (if cache miss)
        if: steps.blast-db-cache.outputs.cache-hit != 'true'
        run: |
          cd backend
          python -m scripts.bootstrap_blast_db

      - name: Start backend
        run: |
          cd backend
          python app.py &
          sleep 3

      - name: Smoke test /api/health
        run: curl -sf http://localhost:5000/api/health

      - name: Smoke test /api/design (hsa-miR-21-5p)
        run: |
          cd backend
          python -m pytest tests/smoke/test_design_e2e.py -v
