<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HG Lab | Stem-loop RT-qPCR Primer Designer</title>
    <meta name="description" content="Automated primer design tool for stem-loop RT-qPCR miRNA quantification. Generates stem-loop RT primer, forward qPCR primer, and universal reverse primer with thermodynamic validation." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- IBM Plex superfamily — interface/data sans + mono for nucleotide sequences (HG Lab Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      document.documentElement.setAttribute(
        'data-theme',
        localStorage.getItem('hglab-theme') || 'pink'
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
